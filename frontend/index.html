<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    
    <!-- PWA Primary Meta Tags -->
    <title>AegisFIM — File & Rootkit Integrity Monitor</title>
    <meta name="title" content="AegisFIM — Autonomous File Integrity & Rootkit Detection System" />
    <meta name="description" content="Tripwire-like File Integrity Monitoring system with SHA-256 baselines, Rootkit heuristics, Ransomware canaries, and Merkle hash chaining." />
    
    <!-- Apple Web App & Status Bar Setup -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AegisFIM" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    
    <!-- Web App Manifest & Theme Color -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0A0A0C" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)" />

    <!-- Google Fonts for Apple-like refined typography fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#050507] text-[#F5F5F7] min-h-screen antialiased selection:bg-[#0077ED]/30 selection:text-white overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('[AegisFIM PWA] Service Worker registered with scope:', reg.scope);
            })
            .catch((err) => {
              console.warn('[AegisFIM PWA] Service Worker registration skipped:', err);
            });
        });
      }
    </script>
  </body>
</html>
