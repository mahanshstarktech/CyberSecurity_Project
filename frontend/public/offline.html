<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AegisFIM — Offline Safeguard</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0A0A0C;
      color: #F5F5F7;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 40px 32px;
      max-width: 440px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(24px);
    }
    .shield-badge {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #0077ED 0%, #00F2FE 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(0, 119, 237, 0.4);
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    p {
      color: #86868B;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      background: #0071E3;
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn:hover {
      background: #0077ED;
      transform: scale(1.02);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="shield-badge">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>
    <h1>AegisFIM Offline Mode</h1>
    <p>You are currently disconnected from network telemetry. The Client-Side WebCrypto engine remains active on cached resources.</p>
    <button class="btn" onclick="window.location.reload()">Reconnect Engine</button>
  </div>
</body>
</html>
