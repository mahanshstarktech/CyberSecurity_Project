<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#0077ED" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="appleBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Apple-Style Squircle Background -->
  <rect width="512" height="512" rx="115" fill="#0A0A0C" />
  
  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="230" r="140" fill="url(#shieldGrad)" opacity="0.3" filter="url(#appleBlur)" />

  <!-- Outer Glass Border -->
  <rect x="2" y="2" width="508" height="508" rx="113" stroke="rgba(255,255,255,0.12)" stroke-width="4" fill="none" />

  <!-- Aegis Shield Silhouette -->
  <path d="M256 90 L390 145 C390 280 256 395 256 415 C256 395 122 280 122 145 Z" 
        fill="url(#shieldGrad)" />

  <!-- Frosted Inner Shield Core -->
  <path d="M256 120 L360 162 C360 270 256 365 256 380 C256 365 152 270 152 162 Z" 
        fill="url(#innerGlow)" stroke="rgba(255,255,255,0.4)" stroke-width="3" />

  <!-- Cryptographic Hash Node / Merkle Core -->
  <circle cx="256" cy="240" r="32" fill="#ffffff" />
  <circle cx="256" cy="240" r="18" fill="#0077ED" />

  <!-- Binary / Integrity Rings -->
  <path d="M200 240 A 56 56 0 0 1 312 240" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85" />
  <path d="M175 240 A 81 81 0 0 1 337 240" stroke="#ffffff" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round" fill="none" opacity="0.6" />
</svg>
